# Base configuration
baseURL = "/"
locale = "en-US"
title = "Graham Plata"
theme = "genuine-parts"
googleAnalytics = "UA-11254643-2"
enableInlineShortcodes = true
pygmentsCodeFences = true
pygmentsUseClasses = true

timeout = "120000ms" # Increase timeout to 120 seconds

staticDir = ["static"]

# Image processing settings
[imaging]
resampleFilter = "lanczos"
anchor = "smart"
bgColor = "#ffffff"
# Enable EXIF data processing
exif.disableDate = false
exif.disableLatLong = false
exif.excludeFields = "GPS"

# Image format specific settings
[imaging.formats]
[imaging.formats.webp]
quality = 85
hint = "photo"
lossless = false
[imaging.formats.jpeg]
quality = 85
progressive = true
[imaging.formats.png]
compressionLevel = 6

[params]
author = "graham.plata@gmail.com"
description = "Graham Plata's home on the web"
tagline = "Welcome to my Digital Sandbox"
copyright = "Copyright © 2026 Graham Plata"
dark = "auto"

highlight = true
showPageTitleInTOC = false

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
ordered = true

[menu]
[[menu.main]]
identifier = "about"
name = "about"
title = "about"
url = "/about/"
weight = 10

[[menu.main]]
identifier = "posts"
name = "posts"
title = "posts"
url = "/posts/"
weight = 20

[[menu.main]]
identifier = "projects"
name = "projects"
title = "projects"
url = "/projects/"
weight = 30

[[menu.main]]
identifier = "gists"
name = "gists"
title = "gists"
url = "/gists/"
weight = 40

[[menu.main]]
identifier = "recipes"
