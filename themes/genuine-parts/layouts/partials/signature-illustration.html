<div class="signature gp-illustration" role="img" aria-label="An exploded-view technical diagram of an air-cooled flat-four engine: a central crankcase with a cylinder-and-head assembly pulled away on each side, a cooling fan housing pulled up, and an oil sump pulled down, each connected to the crankcase by a dashed assembly line along a shared crankshaft axis. One cylinder head carries a torque-spec callout in rust orange; one cylinder barrel carries a bore-diameter callout in cobalt.">
  <svg viewBox="-255 -160 510 335" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="gp-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">

        <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1" opacity="0.35"></line>
      </pattern>
      <marker id="gp-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0 0L8 4L0 8Z" fill="currentColor"></path>
      </marker>
    </defs>

    <g class="gp-ink">
      <!-- shared crankshaft axis -->
      <line class="gp-part gp-axis" x1="-252" y1="0" x2="252" y2="0" stroke="currentColor" stroke-width="1" stroke-dasharray="1 4" opacity="0.45"></line>
      <text class="gp-part gp-label gp-axis-label" x="-250" y="152" text-anchor="start" font-family="var(--font-mono)" font-size="9" letter-spacing="0.06em">CRANKSHAFT AXIS</text>

      <!-- assembly leader lines -->
      <line class="gp-part gp-leader gp-leader-left" x1="-115" y1="0" x2="-65" y2="0" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"></line>
      <line class="gp-part gp-leader gp-leader-right" x1="65" y1="0" x2="115" y2="0" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"></line>
      <line class="gp-part gp-leader gp-leader-top" x1="0" y1="-30" x2="0" y2="-72" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"></line>
      <line class="gp-part gp-leader gp-leader-bottom" x1="0" y1="30" x2="0" y2="55" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"></line>

      <!-- crankcase -->
      <rect class="gp-part gp-crankcase" x="-65" y="-30" width="130" height="60" rx="10" fill="url(#gp-hatch)" stroke="currentColor" stroke-width="1.5"></rect>
      <circle class="gp-part gp-crankcase" cx="0" cy="0" r="14" fill="none" stroke="currentColor" stroke-width="1.2"></circle>

      <!-- left cylinder + head -->
      <g class="gp-part gp-left">
        <rect x="-170" y="-18" width="55" height="36" rx="4" fill="url(#gp-hatch)" stroke="currentColor" stroke-width="1.3"></rect>
        <line x1="-160" y1="-18" x2="-160" y2="18" stroke="currentColor" stroke-width="0.8" opacity="0.6"></line>
        <line x1="-150" y1="-18" x2="-150" y2="18" stroke="currentColor" stroke-width="0.8" opacity="0.6"></line>
        <line x1="-140" y1="-18" x2="-140" y2="18" stroke="currentColor" stroke-width="0.8" opacity="0.6"></line>
        <line x1="-130" y1="-18" x2="-130" y2="18" stroke="currentColor" stroke-width="0.8" opacity="0.6"></line>
        <rect x="-225" y="-24" width="45" height="48" rx="6" fill="url(#gp-hatch)" stroke="currentColor" stroke-width="1.3"></rect>
        <circle cx="-212" cy="-14" r="2.2" fill="currentColor"></circle>
        <circle cx="-188" cy="-14" r="2.2" fill="currentColor"></circle>
        <circle cx="-212" cy="14" r="2.2" fill="currentColor"></circle>
        <circle cx="-188" cy="14" r="2.2" fill="currentColor"></circle>
      </g>

      <!-- right cylinder + head -->
      <g class="gp-part gp-right">
        <rect x="115" y="-18" width="55" height="36" rx="4" fill="url(#gp-hatch)" stroke="currentColor" stroke-width="1.3"></rect>
        <line x1="130" y1="-18" x2="130" y2="18" stroke="currentColor" stroke-width="0.8" opacity="0.6"></line>
        <line x1="140" y1="-18" x2="140" y2="18" stroke="currentColor" stroke-width="0.8" opacity="0.6"></line>
        <line x1="150" y1="-18" x2="150" y2="18" stroke="currentColor" stroke-width="0.8" opacity="0.6"></line>
        <line x1="160" y1="-18" x2="160" y2="18" stroke="currentColor" stroke-width="0.8" opacity="0.6"></line>
        <rect x="180" y="-24" width="45" height="48" rx="6" fill="url(#gp-hatch)" stroke="currentColor" stroke-width="1.3"></rect>
        <circle cx="193" cy="-14" r="2.2" fill="currentColor"></circle>
        <circle cx="217" cy="-14" r="2.2" fill="currentColor"></circle>
        <circle cx="193" cy="14" r="2.2" fill="currentColor"></circle>
        <circle cx="217" cy="14" r="2.2" fill="currentColor"></circle>
      </g>

      <!-- cooling fan housing -->
      <g class="gp-part gp-fan">
        <circle cx="0" cy="-110" r="38" fill="url(#gp-hatch)" stroke="currentColor" stroke-width="1.4"></circle>
        <circle cx="0" cy="-110" r="15" fill="none" stroke="currentColor" stroke-width="1.1"></circle>
        <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" class="gp-fan-blades">
          <line x1="0" y1="-110" x2="0" y2="-124"></line>
          <line x1="0" y1="-110" x2="12" y2="-116"></line>
          <line x1="0" y1="-110" x2="12" y2="-104"></line>
          <line x1="0" y1="-110" x2="0" y2="-96"></line>
          <line x1="0" y1="-110" x2="-12" y2="-104"></line>
          <line x1="0" y1="-110" x2="-12" y2="-116"></line>
        </g>
      </g>

      <!-- oil sump -->
      <path class="gp-part gp-sump" d="M -32 55 L 32 55 L 24 96 Q 0 104 -24 96 Z" fill="url(#gp-hatch)" stroke="currentColor" stroke-width="1.3"></path>

      <!-- labels -->
      <text class="gp-part gp-label" x="-202" y="44" text-anchor="middle" font-family="var(--font-mono)" font-size="10">CYLINDER HEAD</text>
      <text class="gp-part gp-label" x="202" y="44" text-anchor="middle" font-family="var(--font-mono)" font-size="10">CYLINDER HEAD</text>
      <text class="gp-part gp-label" x="0" y="-138" text-anchor="middle" font-family="var(--font-mono)" font-size="10">COOLING FAN</text>
      <text class="gp-part gp-label" x="0" y="118" text-anchor="middle" font-family="var(--font-mono)" font-size="10">OIL SUMP</text>
      <text class="gp-part gp-label" x="0" y="10" text-anchor="middle" font-family="var(--font-mono)" font-size="9.5">CRANKCASE</text>
    </g>

    <!-- rust torque-spec callout -->
    <g class="gp-part gp-callout-rust" style="color: var(--rust, #a84a26)">
      <circle cx="202" cy="-14" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
      <line x1="206" y1="-16" x2="219" y2="-28" stroke="currentColor" stroke-width="1"></line>
      <text x="248" y="-30" text-anchor="end" font-family="var(--font-mono)" font-size="10.5" font-weight="700" style="fill: var(--ink); color: var(--ink)">22 Nm</text>
    </g>

    <!-- cobalt bore-diameter callout -->
    <g class="gp-part gp-callout-cobalt" style="color: var(--cobalt, #1f3d72)">
      <line x1="-170" y1="60" x2="-115" y2="60" stroke="currentColor" stroke-width="1" marker-start="url(#gp-arrow)" marker-end="url(#gp-arrow)"></line>
      <text x="-142" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="10" style="fill: var(--ink)">Ø85mm</text>
    </g>
  </svg>
</div>
