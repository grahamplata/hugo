<header class="masthead">
  <div class="masthead-row">
    <div>
      {{ if .IsHome }}<h1 class="masthead-name"><a href="{{ "/" | absURL }}">{{ .Site.Title }}</a></h1>{{ else }}<p class="masthead-name"><a href="{{ "/" | absURL }}">{{ .Site.Title }}</a></p>{{ end }}
      {{ with .Site.Params.tagline }}<p class="masthead-role">{{ . }}</p>{{ end }}
    </div>
    {{ partial "theme-toggle.html" . }}
  </div>
  <nav class="site-nav" aria-label="Primary">
    {{ range .Site.Menus.main }}
    <a href="{{ .URL | absURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
