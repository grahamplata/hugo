<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
{{ with .Site.Params.description }}<meta name="description" content="{{ if $.IsHome }}{{ . }}{{ else }}{{ $.Description | default ($.Summary | plainify | truncate 160) }}{{ end }}">{{ end }}
<link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | absURL }}" title="{{ .Site.Title }}">
<link rel="preload" href="/fonts/archivo/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/zilla-slab/zilla-slab-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "css/fonts.css" | absURL }}">
<link rel="stylesheet" href="{{ "css/syntax.css" | absURL }}">
<link rel="stylesheet" href="{{ "css/main.css" | absURL }}">
{{ if .Site.Params.googleAnalytics }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.googleAnalytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ .Site.Params.googleAnalytics }}');
</script>
{{ end }}
<script>
  (function () {
    try {
      var stored = localStorage.getItem("genuine-parts-theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    } catch (e) {}
  })();
</script>
