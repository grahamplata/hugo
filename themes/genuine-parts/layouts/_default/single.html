{{ define "main" }}
<article>
  <header>
    <h1>{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
    <p class="parts-meta" style="display:block;margin:-8px 0 24px;">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.project_type }} · {{ . }}{{ end }}
      {{ with .Params.language }} · {{ . }}{{ end }}
      {{ with .Params.category }} · {{ . }}{{ end }}
    </p>
    {{ end }}
  </header>
  {{ .Content }}
</article>
{{ end }}
