{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="parts-list">
  {{ range .Pages }}
  <li class="parts-row">
    <a class="parts-row-link" href="{{ .RelPermalink }}">
      <span class="parts-title">{{ .Title }}</span>
      <span class="parts-leader" aria-hidden="true"></span>
      <span class="parts-meta">{{ if not .Date.IsZero }}{{ .Date.Format "2006" }}{{ end }}</span>
      <svg class="parts-go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg>
    </a>
  </li>
  {{ end }}
</ul>
{{ end }}
