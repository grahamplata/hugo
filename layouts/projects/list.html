{{- define "main" -}}
<div>
    <div class="posts">
        {{- range .Data.Pages -}}
        <article>
            <h3>
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                {{- if .Params.type }}
                <span class="project-type meta-label">{{ .Params.type }}</span>
                {{- end }}
            </h3>
            {{- if .Description }}
            <p class="description">{{ .Description }}</p>
            {{- end }}
        </article>
        {{- end }}
    </div>
</div>
{{- end }}
