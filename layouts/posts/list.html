{{- define "main" -}}
<h1 class="section-heading">Posts</h1>
<div class="posts-by-year">
    {{- range (.Data.Pages.GroupByDate "2006") -}}
    <section class="posts-year">
        <h2 class="year-heading">{{ .Key }}</h2>
        <ul class="parts-list">
            {{- range .Pages -}}
            {{ .Render "li" }}
            {{- end -}}
        </ul>
    </section>
    {{- end -}}
</div>
{{- end -}}
