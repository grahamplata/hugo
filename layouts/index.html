{{ define "main" }}
{{ .Content }}
<h2 class="section-heading">Posts</h2>
<div class="posts-by-year">
    {{- $posts := where site.RegularPages "Type" "posts" -}}
    {{- range ($posts.GroupByDate "2006") -}}
    <section class="posts-year">
        <h3 class="year-heading">{{ .Key }}</h3>
        <ul class="parts-list">
            {{- range .Pages -}}
            {{ .Render "li" }}
            {{- end -}}
        </ul>
    </section>
    {{- end -}}
</div>
{{ end }}
